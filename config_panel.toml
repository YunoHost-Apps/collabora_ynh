version = "1.0"

[main]
name.en = "Collabora configuration"
name.fr = "Configuration de Collabora"

    [main.msfonts]
    name.en = "Microsoft Fonts"
    name.fr = "Polices Microsoft"

        [main.msfonts.msfonts_enabled]
        ask.en = "Would you like to add the non-free Microsoft® fonts for Collabora?"
        ask.fr = "Souhaitez-vous ajouter les polices non-libres de Microsoft® pour Collabora ?"
        type = "boolean"
        yes = "true"
        no = "false"

    [main.dict_install]
    name.en = "Dictionary installation"
    name.fr = "Installation de dictionnaires"

        [main.dict_install.dict_install_info]
		type = "alert"
		style = "info"
        ask.en = "Installing a dictionnary is an irreversible action."
        ask.fr = "Installer un dictionnaire est une action irréversible."

        [main.dict_install.dict_fr_enabled]
        type = "boolean"
        visible = false

        [main.dict_install.dict_de_enabled]
        type = "boolean"
        visible = false

        [main.dict_install.dict_en_enabled]
        type = "boolean"
        visible = false

        [main.dict_install.dict_it_enabled]
        type = "boolean"
        visible = false

        [main.dict_install.dict_es_enabled]
        type = "boolean"
        visible = false

        [main.dict_install.dict_pt_enabled]
        type = "boolean"
        visible = false

        [main.dict_install.dict_nl_enabled]
        type = "boolean"
        visible = false

        [main.dict_install.dict_ru_enabled]
        type = "boolean"
        visible = false

        [main.dict_install.fr_dict_activate]
        ask.en = "Add a french dictionary"
        ask.fr = "Ajouter un dictionnaire français"
        type = "button"
        enabled = "!dict_fr_enabled"

        [main.dict_install.de_dict_activate]
        ask.en = "Add a german dictionary for Collabora"
        ask.fr = "Ajouter un dictionnaire allemand"
        type = "button"
        enabled = "!dict_de_enabled"
        
        [main.dict_install.en_dict_activate]
        ask.en = "Add an english dictionary"
        ask.fr = "Ajouter un dictionnaire anglais"
        type = "button"
        enabled = "!dict_en_enabled"

        [main.dict_install.it_dict_activate]
        ask.en = "Add an italian dictionary"
        ask.fr = "Ajouter un dictionnaire italien"
        type = "button"
        enabled = "!dict_it_enabled"

        [main.dict_install.es_dict_activate]
        ask.en = "Add a spanish dictionary"
        ask.fr = "Ajouter un dictionnaire espagnol"
        type = "button"
        enabled = "!dict_es_enabled"
        
		[main.dict_install.pt_dict_activate]
	    ask.en = "Add a portugese dictionary"
	    ask.fr = "Ajouter un dictionnaire portugais"
	    type = "button"
	    enabled = "!dict_pt_enabled"

        [main.dict_install.nl_dict_activate]
        ask.en = "Add a dutch dictionary"
        ask.fr = "Ajouter un dictionnaire nééerlandais"
        type = "button"
        enabled = "!dict_nl_enabled"

        [main.dict_install.ru_dict_activate]
        ask.en = "Add a russian dictionary"
        ask.fr = "Ajouter un dictionnaire russe"
        type = "button"
        enabled = "!dict_ru_enabled"
